<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beach Break</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;height:100vh;aspect-ratio:9/16;max-width:100vw;container-type:size;overflow:hidden;
         font-family:"Luckiest Guy","Arial Black",Impact,sans-serif}
  @media (max-aspect-ratio:9/16){#stage{width:100vw;height:auto}}
  #gl{display:block;width:100%;height:100%;image-rendering:auto}
  .out{color:#fff;-webkit-text-stroke:.45cqw #1b1240;paint-order:stroke fill;text-shadow:.5cqw .6cqw 0 #1b1240}
  #hud{position:absolute;inset:0;pointer-events:none}
  .meter{position:absolute;left:4cqw;top:3.5cqw;display:flex;align-items:center;gap:2cqw}
  .meter .lbl{font-size:6cqw;color:#ffe14a}
  .bar{width:36cqw;height:4.6cqw;border:.7cqw solid #fff;border-radius:3cqw;background:#2a1a5e;box-shadow:.5cqw .6cqw 0 #1b1240;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cff6a,#ffe14a 55%,#ff4a7d);border-radius:2cqw}
  .meter .max{font-size:4.6cqw;color:#ff4a7d;opacity:0}
  .count{position:absolute;right:4cqw;top:3cqw;display:flex;align-items:center;gap:1.4cqw;font-size:8cqw}
  .count svg{width:8cqw;height:8cqw;filter:drop-shadow(.5cqw .6cqw 0 #1b1240)}
  .clock{position:absolute;right:4cqw;top:13cqw;font-size:5cqw;color:#9ff3ff}
  .card{position:absolute;left:0;right:0;top:34cqw;text-align:center;opacity:0}
  .card .w{font-size:6cqw;color:#9ff3ff}
  .card .t{font-size:13cqw;color:#ffe14a;line-height:1}
  .dlg{position:absolute;left:4cqw;right:4cqw;bottom:6cqw;min-height:22cqw;padding:5cqw 4.5cqw 4cqw;box-sizing:border-box;
       background:linear-gradient(#3a6cf0e6,#1b2f9ae6);border:.8cqw solid #fff;border-radius:4cqw;box-shadow:.8cqw 1cqw 0 #1b1240;opacity:0;
       transform-origin:50% 100%}
  .dlg .name{position:absolute;left:4cqw;top:-4.6cqw;background:#ff8a1f;border:.7cqw solid #fff;border-radius:3cqw;padding:.6cqw 3cqw;font-size:4.6cqw}
  .dlg .tx{font-family:"Trebuchet MS",Verdana,sans-serif;font-weight:bold;font-size:5.2cqw;line-height:1.35;color:#fff;text-shadow:.4cqw .4cqw 0 #10164a}
  .dlg .nx{position:absolute;right:4cqw;bottom:2cqw;font-size:4cqw;color:#ffe14a}
  #fade{position:absolute;inset:0;background:#000;opacity:1;pointer-events:none}
  #play{position:absolute;inset:0;border:0;cursor:pointer;background:radial-gradient(circle at 50% 45%,#2aa6ffcc,#0b1a5ccc);
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;font-family:inherit}
  #play .g{font-size:15cqw;color:#ffe14a;line-height:.95;text-align:center}
  #play .p{font-size:7cqw;animation:blink 1s steps(2) infinite}
  #play .s{font-family:Verdana,sans-serif;font-size:3.4cqw;color:#dff;opacity:.85}
  @keyframes blink{50%{opacity:0}}
  #mute{position:absolute;right:3cqw;bottom:1.2cqw;font-family:inherit;font-size:3.4cqw;background:#0008;color:#fff;border:.4cqw solid #fff;border-radius:2cqw;padding:.6cqw 2cqw;cursor:pointer;display:none;z-index:2}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="hud">
    <div class="meter"><span class="lbl out">BUZZ</span><div class="bar"><i id="buzz"></i></div><span class="max out" id="max">MAX!</span></div>
    <div class="count out"><svg viewBox="0 0 32 32"><path d="M5 6h22l-9 11v8h5v3H9v-3h5v-8z" fill="#ff8a3d" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M20 2l6 6" stroke="#ff4a7d" stroke-width="3"/><circle cx="22" cy="8" r="3" fill="#e0213c" stroke="#fff" stroke-width="1.5"/></svg><span id="cnt">x2</span></div>
    <div class="clock out" id="clock">PM 4:20</div>
    <div class="card" id="card"><div class="w out">WORLD 1-1</div><div class="t out">PAYDAY BEACH</div></div>
    <div class="dlg" id="dlg"><div class="name out">CONSULTANT</div><div class="tx" id="dtx"></div><div class="nx out">▼</div></div>
  </div>
  <div id="fade"></div>
  <button id="play"><span class="g out">BEACH<br>BREAK</span><span class="p out">PRESS START</span><span class="s">클릭하면 음악과 함께 10초 루프 재생</span></button>
  <button id="mute">♪ ON</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DUR=10,RW=288,RH=512;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const bump=(a,b,r,t)=>ss(a,a+r,t)*(1-ss(b-r,b,t));
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

/* ---------- renderer: low res, no AA, bilinear upscale = N64 ---------- */
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:false});
renderer.setPixelRatio(1);renderer.setSize(RW,RH,false);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xbfefff,30,170);
const camera=new THREE.PerspectiveCamera(55,RW/RH,.1,600);
scene.add(new THREE.HemisphereLight(0xd8f4ff,0xe8c890,.8));
const sunL=new THREE.DirectionalLight(0xfff2d0,.85);sunL.position.set(-20,30,-40);scene.add(sunL);

const lam=(color,o={})=>new THREE.MeshLambertMaterial(Object.assign({color},o));
const bas=(color,o={})=>new THREE.MeshBasicMaterial(Object.assign({color},o));
function add(geo,mat,parent,p,r,s){const m=new THREE.Mesh(geo,mat);if(p)m.position.set(...p);if(r)m.rotation.set(...r);if(s)m.scale.set(...s);(parent||scene).add(m);return m}
function grp(parent,p,r){const g=new THREE.Group();if(p)g.position.set(...p);if(r)g.rotation.set(...r);(parent||scene).add(g);return g}
function ctex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.magFilter=THREE.LinearFilter;t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}
const stripes=(cols,n,rep)=>ctex(64,64,(x,w,h)=>{for(let i=0;i<n;i++){x.fillStyle=cols[i%cols.length];x.fillRect(i*w/n,0,w/n+1,h)}},rep);

/* ---------- textures ---------- */
const sandTex=ctex(64,64,(x,w,h)=>{x.fillStyle='#f3d59c';x.fillRect(0,0,w,h);for(let i=0;i<260;i++){x.fillStyle=rnd()<.5?'#e2bd7c':'#fff0c8';x.fillRect(rnd()*w,rnd()*h,2,2)}},[70,22]);
const trunkTex=ctex(64,32,(x,w,h)=>{x.fillStyle='#9a6a3a';x.fillRect(0,0,w,h);x.fillStyle='#5e3c1e';for(let i=0;i<8;i++)x.fillRect(i*8,0,3,h);x.fillStyle='#b98a52';for(let i=0;i<8;i++)x.fillRect(i*8+4,0,1,h)},[1,1]);
trunkTex.wrapS=THREE.RepeatWrapping;trunkTex.repeat.set(1,1);
const leafTex=ctex(128,32,(x,w,h)=>{const g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'#2f8f2a');g.addColorStop(1,'#7fdc3d');
  x.fillStyle=g;x.beginPath();x.moveTo(0,h/2-3);x.quadraticCurveTo(w*.4,0,w,h/2);x.quadraticCurveTo(w*.4,h,0,h/2+3);x.fill();
  x.globalCompositeOperation='destination-out';x.lineWidth=2.5;for(let i=10;i<w;i+=9){x.beginPath();x.moveTo(i,0);x.lineTo(i-6,h/2-3);x.moveTo(i,h);x.lineTo(i-6,h/2+3);x.stroke()}
  x.globalCompositeOperation='source-over';x.strokeStyle='#d8f07a';x.lineWidth=1.5;x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke()});
const shirtTex=ctex(64,64,(x,w,h)=>{x.fillStyle='#14b3b0';x.fillRect(0,0,w,h);
  for(let i=0;i<7;i++){const cx=rnd()*w,cy=rnd()*h;x.fillStyle='#2f8f3a';x.beginPath();x.ellipse(cx+6,cy+4,7,3,.6,0,7);x.fill();
    x.fillStyle=i%2?'#ff5a8a':'#ffd23a';for(let p=0;p<5;p++){const a=p*1.257;x.beginPath();x.arc(cx+Math.cos(a)*4,cy+Math.sin(a)*4,3.6,0,7);x.fill()}
    x.fillStyle='#fff3a0';x.beginPath();x.arc(cx,cy,2,0,7);x.fill()}},[1,1]);
const chairTex=stripes(['#ff3d5a','#ffffff'],8,[1,1]);
const umbTex=stripes(['#ff3d5a','#ffffff','#2a8cff','#ffffff'],8);
const ballTex=stripes(['#ff3d3d','#ffffff','#2a7cff','#ffe14a','#ffffff','#34c759'],6);
const strawTex=ctex(64,64,(x,w,h)=>{x.fillStyle='#d9b45a';x.fillRect(0,0,w,h);for(let i=0;i<70;i++){x.strokeStyle=rnd()<.5?'#a8813a':'#f2d68a';x.beginPath();const px=rnd()*w;x.moveTo(px,0);x.lineTo(px+rnd()*6-3,h);x.stroke()}},[3,2]);
const plankTex=ctex(64,64,(x,w,h)=>{x.fillStyle='#8a5a32';x.fillRect(0,0,w,h);x.fillStyle='#5e3a1e';for(let i=0;i<64;i+=8)x.fillRect(0,i,w,1.5)},[1,1]);
const signTex=ctex(128,32,(x,w,h)=>{x.fillStyle='#6b3f1d';x.fillRect(0,0,w,h);x.strokeStyle='#ffe14a';x.lineWidth=3;x.strokeRect(2,2,w-4,h-4);
  x.fillStyle='#ffe14a';x.font='bold 22px Arial Black,Impact';x.textAlign='center';x.textBaseline='middle';x.fillText('TIKI BAR',w/2,h/2+1)});
function faceTex(drunk){return ctex(64,64,(x,w,h)=>{
  x.strokeStyle='#1a1a1a';x.fillStyle='#1a1a1a';x.lineCap='round';x.lineWidth=3;
  x.beginPath();x.moveTo(13,22);x.lineTo(25,drunk?24:21);x.moveTo(39,drunk?24:21);x.lineTo(51,22);x.stroke();
  if(!drunk){x.beginPath();x.ellipse(20,31,3.2,4.5,0,0,7);x.ellipse(44,31,3.2,4.5,0,0,7);x.fill();
    x.lineWidth=2.5;x.beginPath();x.arc(32,40,8,.25*Math.PI,.75*Math.PI);x.stroke()}
  else{x.lineWidth=3;x.beginPath();x.arc(20,33,5,Math.PI*1.1,Math.PI*1.9);x.moveTo(39,31);x.arc(44,33,5,Math.PI*1.1,Math.PI*1.9);x.stroke();
    x.fillStyle='#7a1f2a';x.beginPath();x.moveTo(22,41);x.quadraticCurveTo(32,58,42,41);x.closePath();x.fill();x.fillStyle='#ff8fa0';x.beginPath();x.ellipse(32,48,5,3,0,0,7);x.fill()}
})}
const faceSober=faceTex(false),faceDrunk=faceTex(true);
const blushTex=ctex(64,64,(x)=>{for(const cx of [14,50]){const g=x.createRadialGradient(cx,40,0,cx,40,10);g.addColorStop(0,'rgba(255,60,90,.95)');g.addColorStop(1,'rgba(255,60,90,0)');x.fillStyle=g;x.fillRect(cx-10,30,20,20)}
  x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=1.5;for(const cx of [10,46])for(let k=0;k<3;k++){x.beginPath();x.moveTo(cx+k*4,44);x.lineTo(cx+k*4+3,38);x.stroke()}});
const bannerTex=ctex(256,64,(x,w,h)=>{x.fillStyle='#ffffff';x.fillRect(0,0,w,h);x.fillStyle='#7823dc';x.fillRect(0,0,w,6);x.fillRect(0,h-6,w,6);
  x.font='bold 44px "Helvetica Neue",Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('Kearney',w/2,h/2+2)});
const foamTex=ctex(128,16,(x,w,h)=>{for(let i=0;i<160;i++){x.fillStyle=`rgba(255,255,255,${.4+rnd()*.6})`;x.beginPath();x.arc(rnd()*w,h/2+(rnd()-.5)*h*.7,1+rnd()*3,0,7);x.fill()}},[30,1]);
function textSprite(txt,col){const t=ctex(128,64,(x,w,h)=>{x.font='bold 40px "Luckiest Guy",Arial Black';x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=8;x.strokeStyle='#1b1240';x.strokeText(txt,w/2,h/2);x.fillStyle=col;x.fillText(txt,w/2,h/2)});
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));s.scale.set(.6,.3,1);scene.add(s);return s}

/* ---------- sky, sun, clouds ---------- */
const skyGeo=new THREE.SphereGeometry(400,16,12),sp=skyGeo.attributes.position,sc=[];
const cTop=new THREE.Color(0x1f74ff),cHor=new THREE.Color(0xc9f4ff),cWarm=new THREE.Color(0xfff0b8);
for(let i=0;i<sp.count;i++){const y=sp.getY(i)/400,c=new THREE.Color();if(y>0)c.copy(cHor).lerp(cTop,Math.pow(y,.55));else c.copy(cWarm);sc.push(c.r,c.g,c.b)}
skyGeo.setAttribute('color',new THREE.Float32BufferAttribute(sc,3));
const skyMat=new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false});add(skyGeo,skyMat);
const sunTex=ctex(64,64,(x)=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fffef0');g.addColorStop(.28,'#fff6b0');g.addColorStop(.32,'rgba(255,240,150,.6)');g.addColorStop(1,'rgba(255,230,140,0)');x.fillStyle=g;x.fillRect(0,0,64,64)});
const sun=new THREE.Sprite(new THREE.SpriteMaterial({map:sunTex,fog:false,transparent:true,depthWrite:false}));sun.position.set(-60,70,-330);sun.scale.set(110,110,1);scene.add(sun);
const cloudMat=lam(0xffffff,{flatShading:true,emissive:0x8899aa,fog:false});const clouds=[];
for(let i=0;i<11;i++){const a=i/11*Math.PI*2+rnd(),r=210+rnd()*60,cg=grp(scene,[Math.sin(a)*r,45+rnd()*45,Math.cos(a)*r]);
  for(let k=0;k<4;k++)add(new THREE.IcosahedronGeometry(9+rnd()*8,0),cloudMat,cg,[k*12-18,rnd()*5,rnd()*8],[rnd(),rnd(),rnd()],[1.3,.75,1]);
  cg.lookAt(0,cg.position.y,0);clouds.push({g:cg,a,r})}

/* ---------- ground & sea ---------- */
const sandH=(x,z)=>z<-10?(z+10)*.05:Math.min(.5,(z+10)*.03)+Math.sin(x*.7)*Math.sin(z*.5)*.04*clamp((z+6)/4,0,1)*clamp((Math.abs(x)-3)/3,0,1);
const sandGeo=new THREE.PlaneGeometry(500,170,70,26);sandGeo.rotateX(-Math.PI/2);sandGeo.translate(0,0,63);
{const p=sandGeo.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,sandH(p.getX(i),p.getZ(i)));sandGeo.computeVertexNormals()}
add(sandGeo,lam(0xffffff,{map:sandTex}));
const seaGeo=new THREE.PlaneGeometry(700,330,48,24);seaGeo.rotateX(-Math.PI/2);seaGeo.translate(0,0,-173);
const seaBase=Float32Array.from(seaGeo.attributes.position.array);
{const p=seaGeo.attributes.position,cols=[];const near=new THREE.Color(0x46f0d8),mid=new THREE.Color(0x14a6e0),far=new THREE.Color(0x0b52b8);
  for(let i=0;i<p.count;i++){const d=clamp((-p.getZ(i)-8)/120,0,1),c=d<.25?near.clone().lerp(mid,d/.25):mid.clone().lerp(far,(d-.25)/.75);cols.push(c.r,c.g,c.b)}
  seaGeo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3))}
const sea=add(seaGeo,lam(0xffffff,{vertexColors:true,emissive:0x0a3050}));
const foam=add(new THREE.PlaneGeometry(500,1.6),bas(0xffffff,{map:foamTex,transparent:true,opacity:.9,depthWrite:false}),scene,[0,.12,-10.5],[-Math.PI/2,0,0]);
for(const [x,z,s] of [[70,-210,1],[-110,-240,1.3],[150,-280,.8]]){const ig=grp(scene,[x,0,z]);
  add(new THREE.ConeGeometry(30*s,22*s,6),lam(0x2f9a4a,{flatShading:true}),ig,[0,8*s,0]);add(new THREE.CylinderGeometry(34*s,36*s,2,8),lam(0xf3d59c),ig,[0,.4,0])}

/* ---------- palms ---------- */
const leafGeo=new THREE.PlaneGeometry(3.4,.95,6,1);leafGeo.translate(1.7,0,0);leafGeo.rotateX(-Math.PI/2);
{const p=leafGeo.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i);p.setY(i,-x*x*.11)}leafGeo.computeVertexNormals()}
const leafMat=lam(0xffffff,{map:leafTex,side:THREE.DoubleSide,alphaTest:.5});
const trunkMat=lam(0xffffff,{map:trunkTex}),cocoMat=lam(0x5a3a1a);const palms=[];
function palm(x,z,h,lean,ry){
  const g=grp(scene,[x,sandH(x,z)-.1,z],[0,ry,0]);const pts=[];
  for(let i=0;i<=4;i++){const s=i/4;pts.push(new THREE.Vector3(lean*s*s*h*.35,s*h,0))}
  const tg=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),8,.2,6,false);trunkTex.repeat.set(5,1);add(tg,trunkMat,g);
  const top=grp(g,[pts[4].x,pts[4].y,0]);
  for(let i=0;i<9;i++)add(leafGeo,leafMat,top,[0,0,0],[0,i*Math.PI*2/9+rnd()*.3,.12+rnd()*.3],[.8+rnd()*.35,1,1]);
  for(let i=0;i<3;i++)add(new THREE.SphereGeometry(.17,6,4),cocoMat,top,[Math.cos(i*2.1)*.22,-.22,Math.sin(i*2.1)*.22]);
  palms.push({top,ph:rnd()*6});
}
[[-1.5,9.5,6.2,1,0.3],[3.8,8,7.4,1.2,2.6],[-2,14,8,.6,1.4],[8,4,5.5,1.4,3.4],[-11,4,7,1.1,-.4],[11,15,8.5,.7,2],[-16,16,7.5,.9,.9],[16,7,6.5,1.2,3.6],[-8,22,9,.5,2.2],[22,-2,6,1.5,3.2]].forEach(a=>palm(...a));

/* ---------- tiki bar ---------- */
{const y=sandH(-7,10),h=grp(scene,[-7.5,y,11],[0,.7,0]);
  add(new THREE.BoxGeometry(3.4,2.2,2.6),lam(0xffffff,{map:plankTex}),h,[0,1.1,0]);
  add(new THREE.BoxGeometry(3.8,.25,.9),lam(0x6b3f1d),h,[0,1.25,-1.6]);
  add(new THREE.ConeGeometry(3.2,1.8,4,1),lam(0xffffff,{map:strawTex,flatShading:true}),h,[0,3.1,0],[0,Math.PI/4,0]);
  add(new THREE.PlaneGeometry(2.4,.6),lam(0xffffff,{map:signTex}),h,[0,2.45,-1.32],[0,Math.PI,0]);
  for(let i=0;i<4;i++)add(new THREE.CylinderGeometry(.18,.18,1.9,6),trunkMat,h,[i<2?-1.8:1.8,1.0,i%2?-2:-1.2]);
  const bc=[0x2fd06a,0xff8a1f,0x9b5cff,0xff3d5a,0x2a8cff];
  for(let i=0;i<5;i++)add(new THREE.CylinderGeometry(.06,.08,.36,6),lam(bc[i]),h,[-1.4+i*.6,1.55,-1.6]);
  for(let i=0;i<3;i++){const sx=-1.2+i*1.2;add(new THREE.CylinderGeometry(.22,.22,.08,8),lam(0xff3d5a),h,[sx,.8,-2.5]);add(new THREE.CylinderGeometry(.05,.05,.8,5),lam(0xdddddd),h,[sx,.4,-2.5])}}

/* ---------- lounger, umbrella, props ---------- */
const Y0=sandH(0,0);const chair=grp(scene,[0,Y0,0]);
const chairMat=lam(0xffffff,{map:chairTex}),frameMat=lam(0xeeeeee);
add(new THREE.BoxGeometry(.74,.06,1.3),chairMat,chair,[0,.38,-.18]);
add(new THREE.BoxGeometry(.74,.06,1.0),chairMat,chair,[0,.77,.78],[-.9,0,0]);
for(const [x,z] of [[-.34,-.75],[.34,-.75],[-.34,.4],[.34,.4]])add(new THREE.BoxGeometry(.05,.38,.05),frameMat,chair,[x,.19,z]);
const umb=grp(scene,[-3.4,Y0,-.6],[0,0,.1]);
add(new THREE.CylinderGeometry(.04,.04,2.6,5),frameMat,umb,[0,1.3,0]);
add(new THREE.ConeGeometry(1.6,.55,8,1,true),lam(0xffffff,{map:umbTex,side:THREE.DoubleSide}),umb,[0,2.55,0]);
const table=grp(scene,[.85,Y0,.15]);
add(new THREE.CylinderGeometry(.3,.3,.04,10),lam(0xffffff),table,[0,.5,0]);add(new THREE.CylinderGeometry(.04,.04,.5,5),frameMat,table,[0,.25,0]);

const NT={A3:220,B3:246.94,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,B5:987.77,C6:1046.5};
const CH=[['C4','E4','G4'],['A3','C4','E4'],['F4','A4','C5'],['G4','B3','D4'],['C4','E4','G4']],ROOT=[130.81,110,87.31,98,130.81],FIFTH=[196,164.81,130.81,146.83,196];
const MEL=[['E5','G5','A5','G5','E5',0,'C5','D5'],['E5',0,'C5','A4',0,'C5','E5','D5'],['F5','A5','C6','A5','F5',0,'E5','D5'],['D5','G5','B5','A5','G5',0,'F5','D5'],['E5',0,'G5',0,'C6',0,0,0]];
function scheduleLoop(T0){
  for(let b=0;b<5;b++){const B=b*2;
    MEL[b].forEach((n,i)=>{if(n){const lt=B+i*.25;steel(T0+lt,NT[n],lt,n==='C6'&&b===4?1.4:.55)}});
    for(let i=0;i<4;i++){const lt=B+i*.5+.25;CH[b].forEach(n=>marimba(T0+lt,NT[n],lt))}
    [[0,ROOT],[.75,FIFTH],[1,ROOT],[1.5,FIFTH],[1.75,ROOT]].forEach(([x,arr])=>bass(T0+B+x,arr[b],B+x));
    for(let i=0;i<8;i++)shaker(T0+B+i*.25,i%2?.07:.035);
    kick(T0+B);kick(T0+B+1);[.5,.75,1.5,1.625,1.75].forEach((x,i)=>bongo(T0+B+x,i%2?300:220,.18))}
  waves(T0);gull(T0+1.1);engine(T0);
  SIPS.forEach(([a,b])=>{slurp(T0+a+.35,b-a-.7);gulp(T0+b-.4);clink(T0+b)});
  clink(T0+5.3);hics.forEach(h=>hic(T0+h.t));
}
function pump(){if(!ac)return;while(ac.currentTime>nextLoop-1.2){scheduleLoop(nextLoop);nextLoop+=DUR}}

/* ---------- loop ---------- */
let started=false,t0perf=0;
function now(){return ac?((ac.currentTime-firstStart)%DUR+DUR)%DUR:((performance.now()-t0perf)/1000)%DUR}
function tick(){pump();frame(now());requestAnimationFrame(tick)}
frame(5.6);fadeEl.style.opacity=0;
document.getElementById('play').onclick=async e=>{
  e.currentTarget.style.display='none';document.getElementById('mute').style.display='block';
  try{initAudio();await ac.resume();firstStart=ac.currentTime+.15;nextLoop=firstStart}catch(err){ac=null;t0perf=performance.now()}
  if(!started){started=true;requestAnimationFrame(tick)}
};
document.getElementById('mute').onclick=e=>{if(!ac)return;muted=!muted;bus.gain.setTargetAtTime(muted?0:.9,ac.currentTime,.05);e.currentTarget.textContent=muted?'♪ OFF':'♪ ON'};
</script>
